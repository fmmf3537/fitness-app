<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: { fontFamily: { sans: ['-apple-system','PingFang SC','Microsoft YaHei','sans-serif'] } } } }
</script>
</head>
<body class="bg-gray-50 font-sans text-gray-900">
<div class="relative flex min-h-[915px] w-full max-w-[412px] flex-col">

  <div class="flex items-center justify-between bg-white px-6 pt-4 text-xs font-medium">
    <span>9:41</span>
    <span class="flex items-center gap-1">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="24" height="12" viewBox="0 0 25 12" fill="none" stroke="currentColor"><rect x="0.5" y="0.5" width="21" height="11" rx="3"/><rect x="2.5" y="2.5" width="15" height="7" rx="1.5" fill="currentColor" stroke="none"/><path d="M23.5 4v4a2 2 0 0 0 0-4z" fill="currentColor" stroke="none"/></svg>
    </span>
  </div>

  <header class="border-b border-gray-100 bg-white px-4 pb-3 pt-2">
    <span class="text-lg font-bold">数据导入</span>
    <p class="mt-0.5 text-xs text-gray-600">原 3 个分散页面（截图补录 / 文件导入 / 历史补录）聚合为一个入口</p>
  </header>

  <main class="flex-1 space-y-3 px-4 py-4">

    <!-- 方式一：截图识别（进行中的任务演示） -->
    <section class="rounded-xl border border-gray-200 bg-white p-4 shadow-sm">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-indigo-50 text-indigo-600">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          </div>
          <div>
            <p class="text-sm font-semibold">截图识别补录</p>
            <p class="text-xs text-gray-600">拍训记 App 截图，AI 自动识别动作与重量</p>
          </div>
        </div>
      </div>

      <!-- 进行中的识别任务：分步状态 + 进度条（原来只有按钮文字变"识别中…"） -->
      <div class="mt-4 rounded-xl bg-gray-50 p-3">
        <div class="flex items-center justify-between text-xs">
          <span class="font-medium text-gray-700">正在识别 3 张截图…</span>
          <span class="text-gray-600">第 2 / 3 张</span>
        </div>
        <div class="mt-2 h-2 w-full overflow-hidden rounded-full bg-gray-200">
          <div class="h-full w-2/3 rounded-full bg-indigo-600 transition-all"></div>
        </div>
        <div class="mt-2 flex items-center gap-2 text-xs text-gray-600">
          <svg class="animate-spin" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.2-8.56"/></svg>
          AI 识别中，通常需要 10–20 秒，可离开本页
        </div>
      </div>

      <button class="mt-3 min-h-[44px] w-full rounded-lg border-2 border-dashed border-indigo-300 bg-indigo-50/50 text-sm font-medium text-indigo-700 active:bg-indigo-100">
        点击选择截图（手机端文案，不再写"拖拽到此处"）
      </button>
    </section>

    <!-- 方式二：佳明文件 -->
    <section class="rounded-xl border border-gray-200 bg-white p-4 shadow-sm">
      <div class="flex items-center gap-3">
        <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-indigo-50 text-indigo-600">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        </div>
        <div class="flex-1">
          <p class="text-sm font-semibold">佳明文件导入</p>
          <p class="text-xs text-gray-600">导入 .fit 原始运动文件（心率、配速）</p>
        </div>
        <button class="min-h-[44px] rounded-lg border border-gray-300 px-4 text-sm font-medium text-gray-700 active:bg-gray-100">选择文件</button>
      </div>
    </section>

    <!-- 方式三：历史补录 -->
    <section class="rounded-xl border border-gray-200 bg-white p-4 shadow-sm">
      <div class="flex items-center gap-3">
        <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-indigo-50 text-indigo-600">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </div>
        <div class="flex-1">
          <p class="text-sm font-semibold">历史数据补录</p>
          <p class="text-xs text-gray-600">按时间段批量拉取训记 / 佳明历史数据</p>
        </div>
        <button class="min-h-[44px] rounded-lg border border-gray-300 px-4 text-sm font-medium text-gray-700 active:bg-gray-100">开始</button>
      </div>
    </section>

    <!-- 防数据丢失提示（对应 P1-5 修复） -->
    <div class="rounded-xl border border-amber-200 bg-amber-50 p-3 text-xs text-amber-800">
      <span class="font-medium">防误清保护：</span>已有 2 张截图完成校对，重新选择图片前会弹确认框，不再静默清空
    </div>
  </main>

  <!-- 底部 5 Tab（我的 激活，导入在我的页面内） -->
  <nav class="sticky bottom-0 flex border-t border-gray-200 bg-white pb-[max(0.5rem,env(safe-area-inset-bottom))] pt-1">
    <a class="flex flex-1 flex-col items-center gap-0.5 py-1.5 text-xs font-medium text-gray-600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      日历
    </a>
    <a class="flex flex-1 flex-col items-center gap-0.5 py-1.5 text-xs font-medium text-gray-600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>
      计划
    </a>
    <a class="flex flex-1 flex-col items-center gap-0.5 py-1.5 text-xs font-medium text-gray-600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
      趋势
    </a>
    <a class="flex flex-1 flex-col items-center gap-0.5 py-1.5 text-xs font-medium text-gray-600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      教练
    </a>
    <a class="flex flex-1 flex-col items-center gap-0.5 py-1.5 text-xs font-medium text-indigo-600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      我的
    </a>
  </nav>
</div>
</body>
</html>
