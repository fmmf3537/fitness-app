<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: { fontFamily: { sans: ['-apple-system','PingFang SC','Microsoft YaHei','sans-serif'] } } } }
</script>
</head>
<body class="bg-gray-50 font-sans text-gray-900">
<div class="relative flex min-h-[915px] w-full max-w-[412px] flex-col">

  <!-- iOS 状态栏模拟 -->
  <div class="flex items-center justify-between bg-white px-6 pt-4 text-xs font-medium text-gray-900">
    <span>9:41</span>
    <span class="flex items-center gap-1">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="24" height="12" viewBox="0 0 25 12" fill="none" stroke="currentColor"><rect x="0.5" y="0.5" width="21" height="11" rx="3"/><rect x="2.5" y="2.5" width="15" height="7" rx="1.5" fill="currentColor" stroke="none"/><path d="M23.5 4v4a2 2 0 0 0 0-4z" fill="currentColor" stroke="none"/></svg>
    </span>
  </div>

  <!-- 顶栏 -->
  <header class="border-b border-gray-100 bg-white px-4 pb-3 pt-2">
    <div class="flex items-center justify-between">
      <span class="text-lg font-bold">健身看板</span>
      <button class="flex min-h-[44px] items-center gap-1.5 rounded-lg border border-gray-300 px-3 text-sm font-medium text-gray-700 active:bg-gray-100">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
        同步
      </button>
    </div>
  </header>

  <main class="flex-1 px-4 py-4">
    <!-- 月份导航：44px 热区 -->
    <div class="mb-4 flex items-center justify-between">
      <button aria-label="上个月" class="flex min-h-[44px] min-w-[44px] items-center justify-center rounded-lg bg-white shadow-sm active:bg-gray-100">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <h2 class="text-lg font-bold">2026 年 9 月</h2>
      <button aria-label="下个月" class="flex min-h-[44px] min-w-[44px] items-center justify-center rounded-lg bg-white shadow-sm active:bg-gray-100">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>

    <!-- 星期头 -->
    <div class="grid grid-cols-7 gap-1 text-center text-xs font-medium text-gray-600">
      <div class="py-1">一</div><div class="py-1">二</div><div class="py-1">三</div><div class="py-1">四</div><div class="py-1">五</div><div class="py-1">六</div><div class="py-1">日</div>
    </div>

    <!-- 日历网格：今天高亮、色点+数量、≥44px 格子 -->
    <div class="mt-1 grid grid-cols-7 gap-1">
      <!-- 第一行空白占位 3 格（9/1 是周四则占位3，这里演示从周四开始） -->
      <div></div><div></div><div></div>
      <!-- 生成 1-30 日的格子：用脚本太重，手工排布关键演示 -->
      <!-- 1-7 -->
      <button class="flex min-h-[52px] flex-col items-center rounded-lg border border-gray-200 bg-white p-1 text-sm"><span class="text-gray-600">1</span></button>
      <button class="flex min-h-[52px] flex-col items-center rounded-lg border border-gray-200 bg-white p-1 text-sm"><span class="text-gray-600">2</span><span class="mt-1 flex gap-1"><span class="h-2 w-2 rounded-full bg-green-500"></span></span></button>
      <button class="flex min-h-[52px] flex-col items-center rounded-lg border border-gray-200 bg-white p-1 text-sm"><span class="text-gray-600">3</span></button>
      <button class="flex min-h-[52px] flex-col items-center rounded-lg border border-gray-200 bg-white p-1 text-sm"><span class="text-gray-600">4</span><span class="mt-1 flex gap-1"><span class="h-2 w-2 rounded-full bg-indigo-500"></span></span></button>
      <!-- 5-11 -->
      <button class="flex min-h-[52px] flex-col items-center rounded-lg border border-gray-200 bg-white p-1 text-sm"><span class="text-gray-600">5</span></button>
      <button class="flex min-h-[52px] flex-col items-center rounded-lg border border-gray-200 bg-white p-1 text-sm"><span class="text-gray-600">6</span><span class="mt-1 flex gap-1"><span class="h-2 w-2 rounded-full bg-green-500"></span><span class="h-2 w-2 rounded-full bg-amber-500"></span></span></button>
      <button class="flex min-h-[52px] flex-col items-center rounded-lg border border-gray-200 bg-white p-1 text-sm"><span class="text-gray-600">7</span></button>
      <button class="flex min-h-[52px] flex-col items-center rounded-lg border border-gray-200 bg-white p-1 text-sm"><span class="text-gray-600">8</span></button>
      <button class="flex min-h-[52px] flex-col items-center rounded-lg border border-gray-200 bg-white p-1 text-sm"><span class="text-gray-600">9</span><span class="mt-1 flex gap-1"><span class="h-2 w-2 rounded-full bg-green-500"></span></span></button>
      <button class="flex min-h-[52px] flex-col items-center rounded-lg border border-gray-200 bg-white p-1 text-sm"><span class="text-gray-600">10</span></button>
      <button class="flex min-h-[52px] flex-col items-center rounded-lg border border-gray-200 bg-white p-1 text-sm"><span class="text-gray-600">11</span><span class="mt-1 flex gap-1"><span class="h-2 w-2 rounded-full bg-indigo-500"></span></span></button>
      <!-- 12-18 -->
      <button class="flex min-h-[52px] flex-col items-center rounded-lg border border-gray-200 bg-white p-1 text-sm"><span class="text-gray-600">12</span></button>
      <button class="flex min-h-[52px] flex-col items-center rounded-lg border border-gray-200 bg-white p-1 text-sm"><span class="text-gray-600">13</span><span class="mt-1 flex gap-1"><span class="h-2 w-2 rounded-full bg-green-500"></span></span></button>
      <!-- 今天 14：高亮 -->
      <button class="flex min-h-[52px] flex-col items-center rounded-lg border-2 border-indigo-600 bg-indigo-50 p-1 text-sm"><span class="font-bold text-indigo-700">14</span><span class="mt-1 flex gap-1"><span class="h-2 w-2 rounded-full bg-amber-500"></span></span></button>
      <button class="flex min-h-[52px] flex-col items-center rounded-lg border border-gray-200 bg-white p-1 text-sm"><span class="text-gray-600">15</span></button>
      <button class="flex min-h-[52px] flex-col items-center rounded-lg border border-gray-200 bg-white p-1 text-sm"><span class="text-gray-600">16</span></button>
      <button class="flex min-h-[52px] flex-col items-center rounded-lg border border-gray-200 bg-white p-1 text-sm"><span class="text-gray-600">17</span></button>
      <button class="flex min-h-[52px] flex-col items-center rounded-lg border border-gray-200 bg-white p-1 text-sm"><span class="text-gray-600">18</span></button>
      <!-- 19-25 -->
      <button class="flex min-h-[52px] flex-col items-center rounded-lg border border-gray-200 bg-white p-1 text-sm"><span class="text-gray-600">19</span></button>
      <button class="flex min-h-[52px] flex-col items-center rounded-lg border border-gray-200 bg-white p-1 text-sm"><span class="text-gray-600">20</span><span class="mt-1 flex gap-1"><span class="h-2 w-2 rounded-full bg-green-500"></span></span></button>
      <button class="flex min-h-[52px] flex-col items-center rounded-lg border border-gray-200 bg-white p-1 text-sm"><span class="text-gray-600">21</span></button>
      <button class="flex min-h-[52px] flex-col items-center rounded-lg border border-gray-200 bg-white p-1 text-sm"><span class="text-gray-600">22</span></button>
      <button class="flex min-h-[52px] flex-col items-center rounded-lg border border-gray-200 bg-white p-1 text-sm"><span class="text-gray-600">23</span><span class="mt-1 flex gap-1"><span class="h-2 w-2 rounded-full bg-indigo-500"></span></span></button>
      <button class="flex min-h-[52px] flex-col items-center rounded-lg border border-gray-200 bg-white p-1 text-sm"><span class="text-gray-600">24</span></button>
      <button class="flex min-h-[52px] flex-col items-center rounded-lg border border-gray-200 bg-white p-1 text-sm"><span class="text-gray-600">25</span></button>
      <!-- 26-30 -->
      <button class="flex min-h-[52px] flex-col items-center rounded-lg border border-gray-200 bg-white p-1 text-sm"><span class="text-gray-600">26</span></button>
      <button class="flex min-h-[52px] flex-col items-center rounded-lg border border-gray-200 bg-white p-1 text-sm"><span class="text-gray-600">27</span><span class="mt-1 flex gap-1"><span class="h-2 w-2 rounded-full bg-green-500"></span></span></button>
      <button class="flex min-h-[52px] flex-col items-center rounded-lg border border-gray-200 bg-white p-1 text-sm"><span class="text-gray-600">28</span></button>
      <button class="flex min-h-[52px] flex-col items-center rounded-lg border border-gray-200 bg-white p-1 text-sm"><span class="text-gray-600">29</span></button>
      <button class="flex min-h-[52px] flex-col items-center rounded-lg border border-gray-200 bg-white p-1 text-sm"><span class="text-gray-600">30</span></button>
    </div>

    <!-- 图例：颜色收敛为 3 个语义色 -->
    <div class="mt-4 flex flex-wrap gap-x-4 gap-y-2 rounded-xl border border-gray-200 bg-white p-3 text-xs text-gray-600">
      <span class="flex items-center gap-1.5"><span class="h-2 w-2 rounded-full bg-green-500"></span>已匹配</span>
      <span class="flex items-center gap-1.5"><span class="h-2 w-2 rounded-full bg-indigo-500"></span>待匹配/仅单源</span>
      <span class="flex items-center gap-1.5"><span class="h-2 w-2 rounded-full bg-amber-500"></span>待确认</span>
    </div>
    <p class="mt-2 text-xs text-gray-600">▲ 图例从 5 色收敛为 3 色；"待确认"同时在底部 Tab 和此处用 amber 强调，点击日期直接进入处理流程</p>

    <!-- 待确认提示条 -->
    <div class="mt-3 flex items-center justify-between rounded-xl border border-amber-200 bg-amber-50 px-4 py-3">
      <span class="text-sm text-amber-800">有 2 条训练记录待确认</span>
      <button class="min-h-[44px] rounded-lg px-3 text-sm font-medium text-amber-800 active:bg-amber-100">去处理</button>
    </div>
  </main>

  <!-- 底部 5 Tab -->
  <nav class="sticky bottom-0 flex border-t border-gray-200 bg-white pb-[max(0.5rem,env(safe-area-inset-bottom))] pt-1">
    <a class="flex flex-1 flex-col items-center gap-0.5 py-1.5 text-xs font-medium text-indigo-600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      日历
    </a>
    <a class="flex flex-1 flex-col items-center gap-0.5 py-1.5 text-xs font-medium text-gray-600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>
      计划
    </a>
    <a class="flex flex-1 flex-col items-center gap-0.5 py-1.5 text-xs font-medium text-gray-600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
      趋势
    </a>
    <a class="relative flex flex-1 flex-col items-center gap-0.5 py-1.5 text-xs font-medium text-gray-600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      教练
    </a>
    <a class="flex flex-1 flex-col items-center gap-0.5 py-1.5 text-xs font-medium text-gray-600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      我的
    </a>
  </nav>
</div>
</body>
</html>
