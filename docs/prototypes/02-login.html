<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: { fontFamily: { sans: ['-apple-system','PingFang SC','Microsoft YaHei','sans-serif'] } } } }
</script>
</head>
<body class="font-sans">
<div class="relative flex min-h-[915px] w-full max-w-[412px] flex-col bg-gradient-to-b from-indigo-600 via-indigo-700 to-indigo-900">

  <!-- iOS 状态栏模拟 -->
  <div class="flex items-center justify-between px-6 pt-4 text-xs font-medium text-white/90">
    <span>9:41</span>
    <span class="flex items-center gap-1">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="24" height="12" viewBox="0 0 25 12" fill="none" stroke="currentColor"><rect x="0.5" y="0.5" width="21" height="11" rx="3"/><rect x="2.5" y="2.5" width="15" height="7" rx="1.5" fill="currentColor" stroke="none"/><path d="M23.5 4v4a2 2 0 0 0 0-4z" fill="currentColor" stroke="none"/></svg>
    </span>
  </div>

  <!-- 品牌区 -->
  <div class="flex flex-1 flex-col items-center justify-center px-8">
    <div class="flex h-20 w-20 items-center justify-center rounded-3xl bg-white/15 shadow-lg backdrop-blur">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6.5 6.5 17.5 17.5"/><path d="m4 8 4-4"/><path d="m16 20 4-4"/>
        <rect x="1.5" y="8.5" width="5" height="7" rx="1.5" transform="rotate(-45 4 12)"/>
        <rect x="17.5" y="8.5" width="5" height="7" rx="1.5" transform="rotate(-45 20 12)"/>
      </svg>
    </div>
    <h1 class="mt-5 text-3xl font-bold tracking-wide text-white">健身看板</h1>
    <p class="mt-2 text-sm text-indigo-200">训练数据整合 · AI 教练点评 · 趋势洞察</p>
  </div>

  <!-- 登录卡片：min-h-dvh 适配 + 安全区 -->
  <div class="rounded-t-3xl bg-white px-6 pb-[max(2rem,env(safe-area-inset-bottom))] pt-8 shadow-2xl">
    <h2 class="text-lg font-bold text-gray-900">登录</h2>
    <p class="mt-1 text-sm text-gray-600">输入访问口令继续</p>

    <label for="password" class="mb-1 mt-6 block text-sm font-medium text-gray-700">口令</label>
    <input id="password" type="password" placeholder="请输入访问口令"
      class="min-h-[44px] w-full rounded-lg border border-gray-300 px-3 text-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 focus:outline-none">

    <!-- 错误态演示 -->
    <p role="alert" class="mt-3 flex items-center gap-1.5 rounded-lg bg-red-50 px-3 py-2 text-sm text-red-600">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      口令错误，请重试（错误态演示）
    </p>

    <button class="mt-6 min-h-[44px] w-full rounded-lg bg-indigo-600 text-sm font-medium text-white active:bg-indigo-700">
      登录
    </button>

    <p class="mt-6 text-center text-xs text-gray-600">登录后自动返回你之前打开的页面</p>
  </div>
</div>
</body>
</html>
