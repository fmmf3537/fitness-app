<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: { fontFamily: { sans: ['-apple-system','PingFang SC','Microsoft YaHei','sans-serif'] } } } }
</script>
</head>
<body class="bg-gray-50 font-sans text-gray-900">
<div class="relative flex min-h-[915px] w-full max-w-[412px] flex-col">

  <div class="flex items-center justify-between bg-white px-6 pt-4 text-xs font-medium">
    <span>9:41</span>
    <span class="flex items-center gap-1">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="24" height="12" viewBox="0 0 25 12" fill="none" stroke="currentColor"><rect x="0.5" y="0.5" width="21" height="11" rx="3"/><rect x="2.5" y="2.5" width="15" height="7" rx="1.5" fill="currentColor" stroke="none"/><path d="M23.5 4v4a2 2 0 0 0 0-4z" fill="currentColor" stroke="none"/></svg>
    </span>
  </div>

  <header class="border-b border-gray-100 bg-white px-4 pb-3 pt-2">
    <div class="flex items-center justify-between">
      <span class="text-lg font-bold">教练中心</span>
      <button class="min-h-[44px] rounded-lg px-3 text-sm font-medium text-red-600 active:bg-red-50">清空对话</button>
    </div>
    <!-- 分段切换：聊天 / 须知（合并两个一级 Tab） -->
    <div class="mt-2 flex rounded-lg bg-gray-100 p-1">
      <button class="min-h-[40px] flex-1 rounded-md bg-white text-sm font-medium shadow-sm">聊天</button>
      <button class="min-h-[40px] flex-1 rounded-md text-sm font-medium text-gray-600">教练须知</button>
    </div>
  </header>

  <!-- 消息流 -->
  <main class="flex-1 space-y-4 overflow-y-auto px-4 py-4">
    <!-- 日期分隔（新增） -->
    <div class="flex items-center gap-3 text-xs text-gray-500">
      <div class="h-px flex-1 bg-gray-200"></div>今天<div class="h-px flex-1 bg-gray-200"></div>
    </div>

    <!-- 用户消息：成功态，带时间戳 -->
    <div class="flex justify-end">
      <div class="max-w-[80%]">
        <div class="whitespace-pre-wrap rounded-2xl rounded-br-sm bg-indigo-600 px-3.5 py-2.5 text-sm text-white">这周深蹲重量要不要加？感觉上周 100kg 做组比较轻松</div>
        <p class="mt-1 text-right text-xs text-gray-600">09:32</p>
      </div>
    </div>

    <!-- 教练回复 -->
    <div class="flex justify-start">
      <div class="max-w-[80%]">
        <div class="whitespace-pre-wrap rounded-2xl rounded-bl-sm border border-gray-200 bg-white px-3.5 py-2.5 text-sm text-gray-800">可以小幅加。建议 102.5kg 做 3×5，观察第三次组的速度。如果最后一次明显粘滞，下周就维持。另外注意你最近两次深蹲前夜的睡眠都不到 6 小时，强度日尽量安排在睡眠充足后。</div>
        <p class="mt-1 text-xs text-gray-600">09:33 · 由 AI 教练生成</p>
      </div>
    </div>

    <!-- 用户消息：失败态（乐观上屏 + 气泡内重试） -->
    <div class="flex justify-end">
      <div class="max-w-[80%]">
        <div class="whitespace-pre-wrap rounded-2xl rounded-br-sm border-2 border-red-300 bg-indigo-600/70 px-3.5 py-2.5 text-sm text-white">那卧推呢？也可以加吗？</div>
        <div class="mt-1 flex items-center justify-end gap-1.5 text-xs text-red-600">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          发送失败
          <button class="min-h-[36px] rounded-lg px-2 font-medium underline">重试</button>
        </div>
      </div>
    </div>
    <p class="text-center text-xs text-gray-600">▲ 失败消息立即上屏并标记，气泡内重试（原实现失败后消息消失，只剩一行红字）</p>

    <!-- 教练正在输入 -->
    <div class="flex justify-start">
      <div class="flex items-center gap-1.5 rounded-2xl rounded-bl-sm border border-gray-200 bg-white px-4 py-3">
        <span class="h-2 w-2 animate-bounce rounded-full bg-gray-400"></span>
        <span class="h-2 w-2 animate-bounce rounded-full bg-gray-400" style="animation-delay:.15s"></span>
        <span class="h-2 w-2 animate-bounce rounded-full bg-gray-400" style="animation-delay:.3s"></span>
      </div>
    </div>
  </main>

  <!-- 输入区：安全区 padding + 自适应高度 -->
  <div class="border-t border-gray-200 bg-white px-3 pb-[max(0.75rem,env(safe-area-inset-bottom))] pt-3">
    <div class="flex items-end gap-2">
      <textarea rows="1" placeholder="向教练提问…" class="max-h-32 min-h-[44px] min-w-0 flex-1 resize-none rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 focus:outline-none"></textarea>
      <button class="flex min-h-[44px] min-w-[44px] shrink-0 items-center justify-center rounded-lg bg-indigo-600 px-4 text-sm font-medium text-white active:bg-indigo-700">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
    <p class="mt-1.5 text-xs text-gray-600">发送按钮统一 indigo 主色（原为 green）；输入框随内容长高，最多 6 行；底部留白适配 Home 手势条</p>
  </div>
</div>
</body>
</html>
