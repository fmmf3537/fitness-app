name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # CI 无 .env、无 Secrets：集成测试由 RUN_*_INTEGRATION 环境变量门禁，默认全部跳过；
      # 单元测试的 FERNET_KEY / DATABASE_URL 由 tests/conftest.py 自构造，绝不真实外呼。
      - name: Run pytest (coverage gate >= 85%)
        working-directory: backend
        run: python -m pytest tests/ -q

  frontend:
    name: frontend (vitest + build + oxlint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 显式 run 模式，防止 watch 模式在 CI 挂起
      - name: Run vitest
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Lint (oxlint)
        run: npx oxlint src
